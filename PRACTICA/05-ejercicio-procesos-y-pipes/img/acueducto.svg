<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 966 510" font-family="sans-serif" font-size="12" fill="#222" role="img" aria-label="Arquitectura de acueducto: ./generador escribe numeros.txt; ./dec2rom lo lee y escribe por una pipe que lee ./rom2dec, que escribe vuelta.txt; diff recibe numeros.txt y vuelta.txt como argumentos, su salida va a /dev/null y su código de salida lo recoge acueducto, que escribe el resultado en la consola">
  <defs>
    <marker id="flecha" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="1" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <marker id="flecha-estado" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="1" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#3a7a3a"/>
    </marker>
  </defs>
  <rect width="966" height="510" fill="#ffffff"/>

  <!-- proceso acueducto -->
  <rect x="16" y="40" width="934" height="290" rx="8" fill="none" stroke="#2b6f99" stroke-width="1.5"/>
  <rect x="26" y="31" width="486" height="18" fill="#ffffff"/>
  <text x="32" y="45"><tspan font-family="monospace" font-weight="bold">acueducto</tspan> — abre los ficheros, crea la pipe y lanza cada hijo con fork + dup2 + execlp</text>

  <!-- procesos hijo -->
  <rect x="36" y="100" width="124" height="50" rx="6" fill="#cfe2f3" stroke="#2b6f99"/>
  <text x="90" y="129" text-anchor="middle" font-family="monospace">./generador</text>

  <rect x="380" y="100" width="124" height="50" rx="6" fill="#cfe2f3" stroke="#2b6f99"/>
  <text x="442" y="129" text-anchor="middle" font-family="monospace">./dec2rom</text>

  <rect x="644" y="100" width="124" height="50" rx="6" fill="#cfe2f3" stroke="#2b6f99"/>
  <text x="706" y="129" text-anchor="middle" font-family="monospace">./rom2dec</text>

  <rect x="512" y="230" width="124" height="50" rx="6" fill="#cfe2f3" stroke="#2b6f99"/>
  <text x="566" y="259" text-anchor="middle" font-family="monospace">diff</text>

  <!-- orden de ejecución -->
  <circle cx="36" cy="100" r="10" fill="#2b6f99"/>
  <text x="36" y="104" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">1</text>
  <circle cx="380" cy="100" r="10" fill="#2b6f99"/>
  <text x="380" y="104" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">2</text>
  <circle cx="644" cy="100" r="10" fill="#2b6f99"/>
  <text x="644" y="104" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">2</text>
  <circle cx="512" cy="230" r="10" fill="#2b6f99"/>
  <text x="512" y="234" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">3</text>

  <!-- ficheros -->
  <rect x="218" y="100" width="104" height="50" rx="14" fill="#fdf3d0" stroke="#a06a1a"/>
  <text x="270" y="129" text-anchor="middle" font-family="monospace">numeros.txt</text>

  <rect x="826" y="100" width="104" height="50" rx="14" fill="#fdf3d0" stroke="#a06a1a"/>
  <text x="878" y="129" text-anchor="middle" font-family="monospace">vuelta.txt</text>

  <rect x="700" y="230" width="104" height="50" rx="14" fill="#fdf3d0" stroke="#a06a1a"/>
  <text x="752" y="259" text-anchor="middle" font-family="monospace">/dev/null</text>

  <!-- stdin / stdout redirigidos a ficheros -->
  <line x1="179" y1="125" x2="209" y2="125" stroke="#333" stroke-width="1.5" marker-end="url(#flecha)"/>
  <line x1="322" y1="125" x2="352" y2="125" stroke="#333" stroke-width="1.5" marker-end="url(#flecha)"/>
  <line x1="787" y1="125" x2="817" y2="125" stroke="#333" stroke-width="1.5" marker-end="url(#flecha)"/>
  <line x1="655" y1="255" x2="691" y2="255" stroke="#333" stroke-width="1.5" marker-end="url(#flecha)"/>

  <!-- pipe (doble línea) -->
  <line x1="523" y1="125" x2="616" y2="125" stroke="#333" stroke-width="5" marker-end="url(#flecha)"/>
  <line x1="523" y1="125" x2="615" y2="125" stroke="#ffffff" stroke-width="2"/>
  <text x="570" y="115" text-anchor="middle" font-size="11">pipe</text>
  <text x="545" y="143" text-anchor="middle" font-size="10.5" font-family="monospace" fill="#444">fds[1]</text>
  <text x="600" y="143" text-anchor="middle" font-size="10.5" font-family="monospace" fill="#444">fds[0]</text>

  <!-- puertos stdin / stdout sobre el borde de cada proceso -->
  <g font-size="10" text-anchor="middle">
    <rect x="141" y="117" width="38" height="16" rx="3" fill="#ffffff" stroke="#2b6f99"/>
    <text x="160" y="129">stdout</text>
    <rect x="361" y="117" width="38" height="16" rx="3" fill="#ffffff" stroke="#2b6f99"/>
    <text x="380" y="129">stdin</text>
    <rect x="485" y="117" width="38" height="16" rx="3" fill="#ffffff" stroke="#2b6f99"/>
    <text x="504" y="129">stdout</text>
    <rect x="625" y="117" width="38" height="16" rx="3" fill="#ffffff" stroke="#2b6f99"/>
    <text x="644" y="129">stdin</text>
    <rect x="749" y="117" width="38" height="16" rx="3" fill="#ffffff" stroke="#2b6f99"/>
    <text x="768" y="129">stdout</text>
    <rect x="617" y="247" width="38" height="16" rx="3" fill="#ffffff" stroke="#2b6f99"/>
    <text x="636" y="259">stdout</text>
    <rect x="171" y="322" width="38" height="16" rx="3" fill="#ffffff" stroke="#2b6f99"/>
    <text x="190" y="334">stdout</text>
  </g>

  <!-- ficheros que diff recibe como argumento -->
  <path d="M270,150 V195 H540 V221" fill="none" stroke="#333" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#flecha)"/>
  <text x="277" y="189" font-size="11" font-family="monospace">argv[1]</text>
  <path d="M878,150 V195 H592 V221" fill="none" stroke="#333" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#flecha)"/>
  <text x="871" y="189" text-anchor="end" font-size="11" font-family="monospace">argv[2]</text>

  <!-- código de salida de diff hacia acueducto -->
  <line x1="566" y1="280" x2="566" y2="321" stroke="#3a7a3a" stroke-width="1.8" stroke-dasharray="2,3" marker-end="url(#flecha-estado)"/>
  <text x="574" y="310" font-size="11">código de salida (waitpid)</text>

  <!-- consola -->
  <line x1="190" y1="338" x2="190" y2="353" stroke="#333" stroke-width="1.5" marker-end="url(#flecha)"/>
  <text x="200" y="353" font-size="11" fill="#444">una de las dos líneas</text>
  <rect x="40" y="362" width="264" height="50" rx="6" fill="#1f2328"/>
  <text x="54" y="383" font-family="monospace" font-size="10.5" fill="#e6edf3">Ambos documentos son idénticos</text>
  <text x="54" y="400" font-family="monospace" font-size="10.5" fill="#e6edf3">Hay discrepancia entre documentos</text>
  <text x="314" y="383" font-size="11" fill="#444">exit 0</text>
  <text x="314" y="400" font-size="11" fill="#444">exit 1</text>

  <!-- leyenda: orden -->
  <text x="36" y="444" font-size="11.5">Orden:</text>
  <circle cx="92" cy="440" r="10" fill="#2b6f99"/>
  <text x="92" y="444" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">1</text>
  <text x="108" y="444" font-size="11.5">→</text>
  <circle cx="134" cy="440" r="10" fill="#2b6f99"/>
  <text x="134" y="444" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">2</text>
  <text x="150" y="444" font-size="11.5">(los dos a la vez) →</text>
  <circle cx="276" cy="440" r="10" fill="#2b6f99"/>
  <text x="276" y="444" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">3</text>
  <text x="294" y="444" font-size="11.5">— acueducto espera a que terminen los de un número antes de lanzar los del siguiente</text>

  <!-- leyenda: nodos -->
  <rect x="36" y="462" width="26" height="14" rx="3" fill="#cfe2f3" stroke="#2b6f99"/>
  <text x="68" y="473" font-size="11">proceso</text>
  <rect x="190" y="462" width="26" height="14" rx="6" fill="#fdf3d0" stroke="#a06a1a"/>
  <text x="222" y="473" font-size="11">fichero</text>
  <rect x="344" y="462" width="26" height="14" rx="3" fill="#1f2328"/>
  <text x="376" y="473" font-size="11">consola</text>

  <!-- leyenda: líneas -->
  <line x1="36" y1="494" x2="62" y2="494" stroke="#333" stroke-width="1.5"/>
  <text x="68" y="498" font-size="11">stdin / stdout</text>
  <line x1="190" y1="494" x2="216" y2="494" stroke="#333" stroke-width="5"/>
  <line x1="190" y1="494" x2="216" y2="494" stroke="#ffffff" stroke-width="2"/>
  <text x="222" y="498" font-size="11">pipe</text>
  <line x1="344" y1="494" x2="370" y2="494" stroke="#333" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="376" y="498" font-size="11">fichero recibido en argv</text>
  <line x1="560" y1="494" x2="586" y2="494" stroke="#3a7a3a" stroke-width="1.8" stroke-dasharray="2,3"/>
  <text x="592" y="498" font-size="11">código de salida (waitpid)</text>
</svg>
