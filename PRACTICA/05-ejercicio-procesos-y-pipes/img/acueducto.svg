<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 984 450" font-family="sans-serif" font-size="12" fill="#222" role="img" aria-label="Arquitectura de acueducto: el generador escribe numeros.txt; dec2rom lo lee y escribe por una pipe que lee rom2dec, que escribe vuelta.txt; diff compara numeros.txt y vuelta.txt, su salida va a /dev/null y su código de salida lo recoge el padre, que imprime el resultado">
  <defs>
    <marker id="flecha" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="1" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <marker id="flecha-estado" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="1" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#3a7a3a"/>
    </marker>
  </defs>
  <rect width="984" height="450" fill="#ffffff"/>

  <!-- recuadro de acueducto -->
  <rect x="16" y="40" width="952" height="345" rx="8" fill="none" stroke="#777" stroke-dasharray="6,4"/>
  <rect x="26" y="31" width="486" height="18" fill="#ffffff"/>
  <text x="32" y="45"><tspan font-family="monospace" font-weight="bold">acueducto</tspan> — abre los ficheros, crea la pipe y lanza cada hijo con fork + dup2 + execlp</text>

  <!-- procesos hijo -->
  <rect x="36" y="100" width="104" height="50" rx="6" fill="#cfe2f3" stroke="#2b6f99"/>
  <text x="88" y="129" text-anchor="middle" font-family="monospace">generador</text>

  <rect x="370" y="100" width="104" height="50" rx="6" fill="#cfe2f3" stroke="#2b6f99"/>
  <text x="422" y="129" text-anchor="middle" font-family="monospace">dec2rom</text>

  <rect x="678" y="100" width="104" height="50" rx="6" fill="#cfe2f3" stroke="#2b6f99"/>
  <text x="730" y="129" text-anchor="middle" font-family="monospace">rom2dec</text>

  <rect x="524" y="240" width="104" height="50" rx="6" fill="#cfe2f3" stroke="#2b6f99"/>
  <text x="576" y="269" text-anchor="middle" font-family="monospace">diff</text>

  <!-- padre -->
  <rect x="36" y="240" width="160" height="50" rx="6" fill="#d9ead3" stroke="#3a7a3a"/>
  <text x="116" y="261" text-anchor="middle">padre</text>
  <text x="116" y="278" text-anchor="middle" font-size="10.5" fill="#444">imprime el resultado</text>

  <!-- orden de ejecución -->
  <circle cx="36" cy="100" r="10" fill="#2b6f99"/>
  <text x="36" y="104" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">1</text>
  <circle cx="370" cy="100" r="10" fill="#2b6f99"/>
  <text x="370" y="104" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">2</text>
  <circle cx="678" cy="100" r="10" fill="#2b6f99"/>
  <text x="678" y="104" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">2</text>
  <circle cx="524" cy="240" r="10" fill="#2b6f99"/>
  <text x="524" y="244" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">3</text>

  <!-- ficheros -->
  <rect x="200" y="100" width="110" height="50" rx="14" fill="#fdf3d0" stroke="#a06a1a"/>
  <text x="255" y="129" text-anchor="middle" font-family="monospace">numeros.txt</text>

  <rect x="842" y="100" width="110" height="50" rx="14" fill="#fdf3d0" stroke="#a06a1a"/>
  <text x="897" y="129" text-anchor="middle" font-family="monospace">vuelta.txt</text>

  <rect x="524" y="322" width="104" height="50" rx="14" fill="#fdf3d0" stroke="#a06a1a"/>
  <text x="576" y="343" text-anchor="middle" font-family="monospace">/dev/null</text>
  <text x="576" y="360" text-anchor="middle" font-size="10.5" fill="#444">(o diff -q)</text>

  <!-- pipe -->
  <rect x="534" y="100" width="84" height="50" rx="4" fill="#d9d9d9" stroke="#555"/>
  <text x="576" y="129" text-anchor="middle" font-family="monospace">pipe</text>

  <!-- pantalla -->
  <rect x="36" y="322" width="300" height="50" rx="4" fill="#eef2f7" stroke="#444"/>
  <text x="48" y="343" font-family="monospace" font-size="10.5">Ambos documentos son idénticos</text>
  <text x="324" y="343" text-anchor="end" font-family="monospace" font-size="10.5" fill="#444">exit 0</text>
  <text x="48" y="360" font-family="monospace" font-size="10.5">Hay discrepancia entre documentos</text>
  <text x="324" y="360" text-anchor="end" font-family="monospace" font-size="10.5" fill="#444">exit 1</text>

  <!-- redirecciones de stdin / stdout -->
  <line x1="140" y1="125" x2="191" y2="125" stroke="#333" stroke-width="1.5" marker-end="url(#flecha)"/>
  <text x="166" y="117" text-anchor="middle" font-size="11">stdout</text>
  <line x1="310" y1="125" x2="361" y2="125" stroke="#333" stroke-width="1.5" marker-end="url(#flecha)"/>
  <text x="336" y="117" text-anchor="middle" font-size="11">stdin</text>
  <line x1="474" y1="125" x2="525" y2="125" stroke="#333" stroke-width="1.5" marker-end="url(#flecha)"/>
  <text x="500" y="117" text-anchor="middle" font-size="11">stdout</text>
  <text x="500" y="141" text-anchor="middle" font-size="10.5" font-family="monospace" fill="#444">fds[1]</text>
  <line x1="618" y1="125" x2="669" y2="125" stroke="#333" stroke-width="1.5" marker-end="url(#flecha)"/>
  <text x="644" y="117" text-anchor="middle" font-size="11">stdin</text>
  <text x="644" y="141" text-anchor="middle" font-size="10.5" font-family="monospace" fill="#444">fds[0]</text>
  <line x1="782" y1="125" x2="833" y2="125" stroke="#333" stroke-width="1.5" marker-end="url(#flecha)"/>
  <text x="808" y="117" text-anchor="middle" font-size="11">stdout</text>
  <line x1="576" y1="290" x2="576" y2="313" stroke="#333" stroke-width="1.5" marker-end="url(#flecha)"/>
  <text x="583" y="306" font-size="11">stdout</text>

  <!-- ficheros que diff recibe como argumento -->
  <path d="M255,150 V200 H550 V231" fill="none" stroke="#333" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#flecha)"/>
  <text x="262" y="194" font-size="11">argumento</text>
  <path d="M897,150 V200 H602 V231" fill="none" stroke="#333" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#flecha)"/>
  <text x="890" y="194" text-anchor="end" font-size="11">argumento</text>

  <!-- código de salida -->
  <line x1="524" y1="265" x2="205" y2="265" stroke="#3a7a3a" stroke-width="1.8" stroke-dasharray="2,3" marker-end="url(#flecha-estado)"/>
  <text x="360" y="257" text-anchor="middle" font-size="11">código de salida (waitpid)</text>
  <line x1="116" y1="290" x2="116" y2="313" stroke="#333" stroke-width="1.5" marker-end="url(#flecha)"/>

  <!-- leyenda -->
  <text x="36" y="410" font-size="11.5">Orden: <tspan font-weight="bold">1</tspan>, acueducto espera a que termine; <tspan font-weight="bold">2</tspan>, los dos a la vez, acueducto espera a ambos; <tspan font-weight="bold">3</tspan>, diff.</text>
  <line x1="36" y1="430" x2="66" y2="430" stroke="#333" stroke-width="1.5"/>
  <text x="72" y="434" font-size="11">stdin / stdout redirigidos con dup2</text>
  <line x1="290" y1="430" x2="320" y2="430" stroke="#333" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="326" y="434" font-size="11">fichero que diff abre por su nombre</text>
  <line x1="540" y1="430" x2="570" y2="430" stroke="#3a7a3a" stroke-width="1.8" stroke-dasharray="2,3"/>
  <text x="576" y="434" font-size="11">código de salida recogido por el padre</text>
</svg>
