<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1002 472" font-family="sans-serif" font-size="12" fill="#222" role="img" aria-label="Arquitectura del simulador hidráulico: llena_deposito suma litros al depósito; el surtidor los resta y manda fluido_t por una tubería al caudalímetro y de ahí al sumidero; surtidor y sumidero actualizan los litros en el surtidor (memoria compartida); el sumidero avisa al monitor con SIGUSR1; surtidor y caudalímetro mandan alertas a una cola que lee el hijo del monitor">
  <defs>
    <marker id="flecha" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="1" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <marker id="flecha-senal" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="1" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b03a2e"/>
    </marker>
  </defs>
  <rect width="1002" height="472" fill="#ffffff"/>

  <!-- recuadro del gestor -->
  <rect x="148" y="40" width="838" height="360" rx="8" fill="none" stroke="#777" stroke-dasharray="6,4"/>
  <rect x="158" y="31" width="452" height="18" fill="#ffffff"/>
  <text x="164" y="45"><tspan font-family="monospace" font-weight="bold">gestor</tspan> — crea lo que hay dentro del recuadro; con Ctrl-C borra los recursos IPC</text>

  <!-- recuadro del monitor -->
  <rect x="842" y="80" width="128" height="196" rx="8" fill="none" stroke="#2b6f99" stroke-dasharray="4,3"/>
  <rect x="874" y="72" width="64" height="16" fill="#ffffff"/>
  <text x="906" y="85" text-anchor="middle" font-family="monospace" font-weight="bold">monitor</text>

  <!-- procesos -->
  <rect x="16" y="210" width="114" height="50" rx="6" fill="#d9ead3" stroke="#3a7a3a"/>
  <text x="73" y="231" text-anchor="middle" font-family="monospace">llena_deposito</text>
  <text x="73" y="248" text-anchor="middle" font-size="10.5" fill="#444">(se lanza a mano)</text>

  <rect x="366" y="210" width="100" height="50" rx="6" fill="#cfe2f3" stroke="#2b6f99"/>
  <text x="416" y="239" text-anchor="middle" font-family="monospace">surtidor</text>

  <rect x="526" y="210" width="100" height="50" rx="6" fill="#cfe2f3" stroke="#2b6f99"/>
  <text x="576" y="239" text-anchor="middle" font-family="monospace">caudalimetro</text>

  <rect x="686" y="210" width="100" height="50" rx="6" fill="#cfe2f3" stroke="#2b6f99"/>
  <text x="736" y="239" text-anchor="middle" font-family="monospace">sumidero</text>

  <rect x="856" y="100" width="100" height="50" rx="6" fill="#cfe2f3" stroke="#2b6f99"/>
  <text x="906" y="121" text-anchor="middle">hijo</text>
  <text x="906" y="138" text-anchor="middle" font-size="10.5" fill="#444">imprime alertas</text>

  <rect x="856" y="210" width="100" height="50" rx="6" fill="#cfe2f3" stroke="#2b6f99"/>
  <text x="906" y="231" text-anchor="middle">padre</text>
  <text x="906" y="248" text-anchor="middle" font-size="10.5" fill="#444">imprime litros</text>

  <!-- recursos IPC -->
  <rect x="200" y="210" width="110" height="50" rx="14" fill="#fdf3d0" stroke="#a06a1a"/>
  <text x="255" y="231" text-anchor="middle">depósito</text>
  <text x="255" y="248" text-anchor="middle" font-size="10.5" font-family="monospace" fill="#444">SEM_DEPOSITO</text>

  <rect x="380" y="100" width="280" height="50" rx="14" fill="#fdf3d0" stroke="#a06a1a"/>
  <text x="520" y="121" text-anchor="middle">alertas</text>
  <text x="520" y="138" text-anchor="middle" font-size="10.5" fill="#444">cola de mensajes · tipo 1 antes que tipo 2</text>

  <rect x="366" y="330" width="420" height="50" rx="14" fill="#fdf3d0" stroke="#a06a1a"/>
  <text x="576" y="351" text-anchor="middle">litros en el surtidor</text>
  <text x="576" y="368" text-anchor="middle" font-size="10.5" fill="#444">memoria compartida · acceso con <tspan font-family="monospace">SEM_MUTEX</tspan></text>

  <!-- flujo principal -->
  <line x1="130" y1="235" x2="191" y2="235" stroke="#333" stroke-width="1.5" marker-end="url(#flecha)"/>
  <text x="174" y="227" text-anchor="middle" font-size="11">+litros</text>
  <line x1="310" y1="235" x2="357" y2="235" stroke="#333" stroke-width="1.5" marker-end="url(#flecha)"/>
  <text x="338" y="227" text-anchor="middle" font-size="11">−caudal</text>
  <line x1="466" y1="235" x2="517" y2="235" stroke="#333" stroke-width="3.5" marker-end="url(#flecha)"/>
  <text x="496" y="225" text-anchor="middle" font-size="10.5" font-family="monospace">fluido_t</text>
  <line x1="626" y1="235" x2="677" y2="235" stroke="#333" stroke-width="3.5" marker-end="url(#flecha)"/>
  <text x="656" y="225" text-anchor="middle" font-size="10.5" font-family="monospace">fluido_t</text>

  <!-- alertas -->
  <line x1="416" y1="210" x2="416" y2="159" stroke="#333" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#flecha)"/>
  <text x="423" y="189" font-size="11">tipo 1</text>
  <line x1="576" y1="210" x2="576" y2="159" stroke="#333" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#flecha)"/>
  <text x="583" y="189" font-size="11">tipo 2</text>
  <line x1="660" y1="125" x2="847" y2="125" stroke="#333" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#flecha)"/>
  <text x="752" y="117" text-anchor="middle" font-size="10.5" font-family="monospace">msgrcv tipo -2</text>

  <!-- memoria compartida -->
  <line x1="416" y1="260" x2="416" y2="321" stroke="#333" stroke-width="1.5" marker-end="url(#flecha)"/>
  <text x="423" y="299" font-size="11">+caudal</text>
  <line x1="736" y1="260" x2="736" y2="321" stroke="#333" stroke-width="1.5" marker-end="url(#flecha)"/>
  <text x="743" y="299" font-size="11">−caudal</text>
  <path d="M786,355 H906 V269" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#flecha)"/>
  <text x="846" y="347" text-anchor="middle" font-size="11">lee</text>

  <!-- señal -->
  <line x1="786" y1="235" x2="847" y2="235" stroke="#b03a2e" stroke-width="1.8" stroke-dasharray="2,3" marker-end="url(#flecha-senal)"/>
  <text x="814" y="227" text-anchor="middle" font-size="10.5" font-family="monospace" fill="#b03a2e">SIGUSR1</text>

  <!-- leyenda -->
  <line x1="20" y1="424" x2="60" y2="424" stroke="#333" stroke-width="3.5"/>
  <text x="68" y="428" font-size="11">tubería (pipe)</text>
  <line x1="190" y1="424" x2="230" y2="424" stroke="#333" stroke-width="1.5"/>
  <text x="238" y="428" font-size="11">semáforo / memoria compartida</text>
  <line x1="430" y1="424" x2="470" y2="424" stroke="#333" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="478" y="428" font-size="11">mensaje en la cola</text>
  <line x1="610" y1="424" x2="650" y2="424" stroke="#b03a2e" stroke-width="1.8" stroke-dasharray="2,3"/>
  <text x="658" y="428" font-size="11">señal</text>

  <rect x="20" y="444" width="40" height="16" rx="4" fill="#cfe2f3" stroke="#2b6f99"/>
  <text x="68" y="456" font-size="11">proceso creado por el gestor</text>
  <rect x="250" y="444" width="40" height="16" rx="4" fill="#d9ead3" stroke="#3a7a3a"/>
  <text x="298" y="456" font-size="11">proceso lanzado a mano</text>
  <rect x="450" y="444" width="40" height="16" rx="8" fill="#fdf3d0" stroke="#a06a1a"/>
  <text x="498" y="456" font-size="11">recurso IPC</text>
</svg>
