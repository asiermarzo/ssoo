# sesion.conf — sesion de depuracion guiada, montada entera por tmux.
#
#   cd PRACTICA/00-shell-y-herramientas/tmux-demo
#   gcc -g -O0 -Wall -Wextra -o demo demo.c
#   tmux kill-server 2>/dev/null      # cierra sesiones anteriores (2>/dev/null calla el error si no hay ninguna)
#   tmux -f sesion.conf attach        # arranca tmux con esta config y se conecta
#
# Distribucion:
#   +--------------------+--------------+
#   |                    |  auto 'n'    |  manda 'n' a gdb cada segundo
#   |    gdb -tui        +--------------+
#   |    (panel 0)       |  killall     |  comando escrito, SIN ejecutar
#   +--------------------+--------------+

# Indices predecibles: no dependas de la config personal (~/.tmux.conf) del usuario.
set -g base-index 0
set -g pane-base-index 0

# Raton activado: clic en un panel para pasarle el foco, rueda para hacer scroll.
set -g mouse on

# --- panel grande: gdb en modo TUI, parado en main (ver comandos.gdb) ---
new-session -s depura -n debug
send-keys -t depura:debug.0 'gdb -tui -x comandos.gdb ./demo' Enter

# --- panel pequeno arriba-derecha: "pulsa" n en el panel de gdb una vez por segundo ---
split-window -h -l 42% -t depura:debug.0
send-keys -t depura:debug.1 'while sleep 1; do tmux send-keys -t depura:debug.0 n Enter; done' Enter

# --- panel pequeno abajo-derecha: killall preparado, pero SIN enviar (sin Enter) ---
split-window -v -l 45% -t depura:debug.1
send-keys -t depura:debug.2 'clear; echo "Enfoca aqui y pulsa Enter para cortar la demo:"' Enter
send-keys -t depura:debug.2 'killall demo'

# el foco arranca en el panel de gdb
select-pane -t depura:debug.0
