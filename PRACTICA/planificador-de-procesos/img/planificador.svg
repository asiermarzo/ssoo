<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 370" font-family="sans-serif" font-size="12" fill="#222" role="img" aria-label="Arquitectura del planificador: encolador manda peticion_t de tipo 1 a 4 a la cola esperando; procsched las lee con tipo -4, mete cada proceso_t en su cola listos con cola_encolar y elige el siguiente con COLA_FOR_EACH y cola_desencolar; manda SIGCONT al hijo en ejecución y SIGSTOP a los parados">
  <defs>
    <marker id="flecha" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="1" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <marker id="flecha-senal" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="1" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b03a2e"/>
    </marker>
  </defs>
  <rect width="1000" height="370" fill="#ffffff"/>

  <!-- encolador -->
  <rect x="16" y="197" width="120" height="56" rx="6" fill="#d9ead3" stroke="#3a7a3a"/>
  <text x="76" y="220" text-anchor="middle" font-family="monospace">encolador</text>
  <text x="76" y="238" text-anchor="middle" font-size="10.5" fill="#444">(se lanza a mano)</text>

  <!-- esperando -->
  <rect x="210" y="197" width="130" height="56" rx="14" fill="#fdf3d0" stroke="#a06a1a"/>
  <text x="275" y="220" text-anchor="middle">esperando</text>
  <text x="275" y="238" text-anchor="middle" font-size="10.5" fill="#444">cola de mensajes</text>

  <!-- procsched con listos dentro -->
  <rect x="410" y="150" width="280" height="150" rx="6" fill="#cfe2f3" stroke="#2b6f99"/>
  <text x="550" y="172" text-anchor="middle" font-family="monospace" font-weight="bold">procsched</text>

  <rect x="450" y="232" width="200" height="56" rx="4" fill="#ececec" stroke="#666"/>
  <text x="550" y="249" text-anchor="middle" font-family="monospace" font-weight="bold">listos</text>
  <g font-size="10" font-family="monospace" text-anchor="middle">
    <rect x="460" y="258" width="42" height="22" rx="2" fill="#ffffff" stroke="#888"/>
    <text x="481" y="273">prio 2</text>
    <rect x="506" y="258" width="42" height="22" rx="2" fill="#ffffff" stroke="#888"/>
    <text x="527" y="273">prio 3</text>
    <rect x="552" y="258" width="42" height="22" rx="2" fill="#ffffff" stroke="#888"/>
    <text x="573" y="273">prio 1</text>
    <rect x="598" y="258" width="42" height="22" rx="2" fill="#ffffff" stroke="#888"/>
    <text x="619" y="273">prio 2</text>
  </g>

  <line x1="510" y1="180" x2="510" y2="223" stroke="#333" stroke-width="1.5" marker-end="url(#flecha)"/>
  <text x="504" y="203" text-anchor="end" font-size="10" font-family="monospace">cola_encolar</text>
  <text x="504" y="217" text-anchor="end" font-size="10" font-family="monospace" fill="#444">proceso_t</text>
  <line x1="590" y1="232" x2="590" y2="189" stroke="#333" stroke-width="1.5" marker-end="url(#flecha)"/>
  <text x="597" y="203" font-size="10" font-family="monospace">COLA_FOR_EACH</text>
  <text x="597" y="217" font-size="10" font-family="monospace">cola_desencolar</text>

  <!-- hijos -->
  <rect x="820" y="155" width="160" height="40" rx="6" fill="#cfe2f3" stroke="#2b6f99" stroke-width="2"/>
  <text x="900" y="172" text-anchor="middle" font-family="monospace">./arkanoid 0 0</text>
  <text x="900" y="187" text-anchor="middle" font-size="10.5" fill="#444">en ejecución</text>

  <rect x="820" y="210" width="160" height="40" rx="6" fill="#cfe2f3" stroke="#2b6f99"/>
  <text x="900" y="227" text-anchor="middle" font-family="monospace">./buddhabrot 300 0</text>
  <text x="900" y="242" text-anchor="middle" font-size="10.5" fill="#444">parado</text>

  <rect x="820" y="265" width="160" height="40" rx="6" fill="#cfe2f3" stroke="#2b6f99"/>
  <text x="900" y="282" text-anchor="middle" font-family="monospace">./raytracer 600 0</text>
  <text x="900" y="297" text-anchor="middle" font-size="10.5" fill="#444">parado</text>

  <!-- mensajes -->
  <line x1="136" y1="225" x2="201" y2="225" stroke="#333" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#flecha)"/>
  <text x="170" y="216" text-anchor="middle" font-size="10.5" font-family="monospace">peticion_t</text>
  <text x="170" y="240" text-anchor="middle" font-size="10.5" font-family="monospace" fill="#444">tipo 1–4</text>
  <line x1="340" y1="225" x2="401" y2="225" stroke="#333" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#flecha)"/>
  <text x="372" y="216" text-anchor="middle" font-size="10.5" font-family="monospace">peticion_t</text>
  <text x="372" y="240" text-anchor="middle" font-size="10.5" font-family="monospace" fill="#444">tipo -4</text>

  <!-- señales -->
  <line x1="690" y1="175" x2="811" y2="175" stroke="#b03a2e" stroke-width="1.8" stroke-dasharray="2,3" marker-end="url(#flecha-senal)"/>
  <line x1="690" y1="230" x2="811" y2="230" stroke="#b03a2e" stroke-width="1.8" stroke-dasharray="2,3" marker-end="url(#flecha-senal)"/>
  <line x1="690" y1="285" x2="811" y2="285" stroke="#b03a2e" stroke-width="1.8" stroke-dasharray="2,3" marker-end="url(#flecha-senal)"/>
  <g font-size="10.5" font-family="monospace" fill="#b03a2e" text-anchor="middle">
    <text x="750" y="167">SIGCONT</text>
    <text x="750" y="222">SIGSTOP</text>
    <text x="750" y="277">SIGSTOP</text>
  </g>

  <!-- leyenda -->
  <line x1="20" y1="346" x2="60" y2="346" stroke="#333" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="68" y="350" font-size="11">mensaje</text>
  <line x1="140" y1="346" x2="180" y2="346" stroke="#b03a2e" stroke-width="1.8" stroke-dasharray="2,3"/>
  <text x="188" y="350" font-size="11">señal</text>
  <rect x="250" y="338" width="40" height="16" rx="4" fill="#cfe2f3" stroke="#2b6f99"/>
  <text x="298" y="350" font-size="11">proceso</text>
  <rect x="370" y="338" width="40" height="16" rx="4" fill="#d9ead3" stroke="#3a7a3a"/>
  <text x="418" y="350" font-size="11">lanzado a mano</text>
  <rect x="530" y="338" width="40" height="16" rx="8" fill="#fdf3d0" stroke="#a06a1a"/>
  <text x="578" y="350" font-size="11">recurso IPC</text>
  <rect x="670" y="338" width="40" height="16" rx="2" fill="#ececec" stroke="#666"/>
  <text x="718" y="350" font-size="11">estructura de datos</text>
</svg>
