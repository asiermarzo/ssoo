<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 230" font-family="sans-serif" font-size="12" role="img" aria-label="El escritor llena el búfer del kernel y se bloquea cuando está lleno; el lector vacía el búfer y se bloquea cuando está vacío">
  <rect width="640" height="230" fill="#ffffff"/>
  <text x="320" y="22" text-anchor="middle" font-size="11" fill="#666">búfer FIFO del kernel · tamaño finito (típicamente 64 KiB en Linux)</text>

  <rect x="15" y="80" width="120" height="60" rx="6" fill="#6ba3d6" stroke="#2b6f99"/>
  <text x="75" y="106" text-anchor="middle" fill="#fff" font-size="10">Proceso</text>
  <text x="75" y="120" text-anchor="middle" fill="#fff" font-size="10">escritor</text>

  <rect x="505" y="80" width="120" height="60" rx="6" fill="#6ba3d6" stroke="#2b6f99"/>
  <text x="565" y="106" text-anchor="middle" fill="#fff" font-size="10">Proceso</text>
  <text x="565" y="120" text-anchor="middle" fill="#fff" font-size="10">lector</text>

  <rect x="175" y="70" width="290" height="80" rx="10" fill="#eef2f7" stroke="#333"/>
  <g>
    <rect x="188" y="95" width="26" height="30" fill="#f4d35e" stroke="#a9861e"/>
    <rect x="218" y="95" width="26" height="30" fill="#f4d35e" stroke="#a9861e"/>
    <rect x="248" y="95" width="26" height="30" fill="#f4d35e" stroke="#a9861e"/>
    <rect x="278" y="95" width="26" height="30" fill="#f4d35e" stroke="#a9861e"/>
    <rect x="308" y="95" width="26" height="30" fill="#f4d35e" stroke="#a9861e"/>
    <rect x="338" y="95" width="26" height="30" fill="#f4d35e" stroke="#a9861e"/>
    <rect x="368" y="95" width="26" height="30" fill="#f4d35e" stroke="#a9861e"/>
    <rect x="398" y="95" width="26" height="30" fill="#ffffff" stroke="#999" stroke-dasharray="2,2"/>
    <rect x="428" y="95" width="26" height="30" fill="#ffffff" stroke="#999" stroke-dasharray="2,2"/>
  </g>
  <text x="320" y="65" text-anchor="middle" font-size="10" fill="#666">casi lleno</text>

  <line x1="137" y1="110" x2="173" y2="110" stroke="#333" stroke-width="1.5" marker-end="url(#arrPB)"/>
  <line x1="467" y1="110" x2="503" y2="110" stroke="#333" stroke-width="1.5" marker-end="url(#arrPB)"/>
  <defs>
    <marker id="arrPB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#333"/></marker>
  </defs>

  <text x="75" y="165" text-anchor="middle" font-size="9.5" fill="#a12b2b">write() bloquea</text>
  <text x="75" y="178" text-anchor="middle" font-size="9.5" fill="#a12b2b">si está lleno</text>
  <text x="565" y="165" text-anchor="middle" font-size="9.5" fill="#2b6f99">read() bloquea</text>
  <text x="565" y="178" text-anchor="middle" font-size="9.5" fill="#2b6f99">si está vacío</text>

  <text x="320" y="205" text-anchor="middle" font-size="9.5" fill="#666">hasta PIPE_BUF bytes (típ. 4096), cada write() se entrelaza sin mezclarse con otros</text>
</svg>
