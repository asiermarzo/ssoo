<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 175" font-family="sans-serif" font-size="12" role="img" aria-label="Disposición de un sistema de ficheros UNIX en la partición: bloque de arranque, superbloque, mapa de bits de nodos-i, mapa de bits de bloques, tabla de nodos-i y bloques de datos">
  <rect width="760" height="175" fill="#ffffff"/>
  <text x="10" y="20" font-size="11" fill="#666">inicio de la partición →</text>
  <!-- zonas -->
  <rect x="10" y="30" width="70" height="60" fill="#d9d9d9" stroke="#444"/>
  <rect x="80" y="30" width="100" height="60" fill="#fce5a8" stroke="#444"/>
  <rect x="180" y="30" width="100" height="60" fill="#d9ead3" stroke="#444"/>
  <rect x="280" y="30" width="100" height="60" fill="#d9ead3" stroke="#444"/>
  <rect x="380" y="30" width="140" height="60" fill="#cfe2f3" stroke="#444"/>
  <rect x="520" y="30" width="230" height="60" fill="#eef2f7" stroke="#444"/>
  <g text-anchor="middle">
    <text x="45" y="57">Bloque de</text><text x="45" y="72">arranque</text>
    <text x="130" y="64">Superbloque</text>
    <text x="230" y="57">Mapa de bits</text><text x="230" y="72">de nodos-i</text>
    <text x="330" y="57">Mapa de bits</text><text x="330" y="72">de bloques</text>
    <text x="450" y="57">Tabla de</text><text x="450" y="72">nodos-i</text>
    <text x="635" y="64">Bloques de datos</text>
  </g>
  <!-- descripciones -->
  <g text-anchor="middle" font-size="10" fill="#333">
    <text x="45" y="110">código para</text><text x="45" y="123">arrancar el SO</text>
    <text x="130" y="110">tamaño de bloque,</text><text x="130" y="123">nº de bloques y</text><text x="130" y="136">nodos-i, libres</text>
    <text x="230" y="110">un bit por nodo-i:</text><text x="230" y="123">libre u ocupado</text>
    <text x="330" y="110">un bit por bloque:</text><text x="330" y="123">libre u ocupado</text>
    <text x="450" y="110">un nodo-i por fichero</text><text x="450" y="123">(número fijo)</text>
    <text x="635" y="110">contenido de los ficheros</text><text x="635" y="123">y de los directorios</text>
  </g>
  <text x="10" y="163" font-size="10" fill="#666">ext2/3/4 repite superbloque, mapas de bits y tabla de nodos-i en cada grupo de bloques</text>
</svg>
