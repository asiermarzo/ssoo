<text x="492" y="34" class="m s d e">0</text>
<text x="492" y="94" class="m s d e">1000</text>
<text x="492" y="214" class="m s d e">1500</text>
<line x1="20" y1="300" x2="700" y2="300" stroke="#2a2e35"/>
<text x="160" y="148" class="c m b y l">700</text>
<polygon points="250,118 300,160 250,202 200,160" fill="none" stroke="#ef5350" stroke-width="3"/>
<line x1="250" y1="202" x2="250" y2="244" stroke="#ef5350" stroke-width="3" marker-end="url(#ar)"/>
<rect x="196" y="249" width="108" height="24" rx="4" fill="none" stroke="#ef5350" stroke-width="2"/>
<text x="24" y="324" class="cap"><tspan class="d">2</tspan><tspan dx="10">700 ≥ 500: no se traduce; excepción y el SO termina el proceso</tspan></text>
</g>
</svg>
