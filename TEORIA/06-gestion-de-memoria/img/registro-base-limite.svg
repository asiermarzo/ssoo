<text x="590" y="65" class="c y b">SO</text>
<rect x="500" y="90" width="180" height="120" rx="0" fill="#5c2f1b" stroke="#e8804a" stroke-width="1.5"/>
<text x="590" y="190" class="c o b">P1</text>
