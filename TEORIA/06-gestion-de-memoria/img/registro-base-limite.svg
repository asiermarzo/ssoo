<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 692" role="img" aria-label="Traducción con registro base y límite: la dirección lógica 200 es menor que el límite y se le suma la base (1200); la 700 supera el límite y provoca una excepción">
<style>
text{font-family:"Segoe UI",Helvetica,Arial,sans-serif;font-size:14px;fill:#e6e6e6}
.m{font-family:Consolas,"DejaVu Sans Mono",Menlo,monospace}
.d{fill:#8b949e}.ok{fill:#4cc26a}.er{fill:#ef5350}.y{fill:#f4d03f}.o{fill:#f0a070}.t{fill:#6fd3e3}
.c{text-anchor:middle}.e{text-anchor:end}.b{font-weight:600}.s{font-size:12px}.l{font-size:18px}.xl{font-size:26px}
.cap{font-size:14px}
</style>
<defs>
<marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cfd4da"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4cc26a"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ef5350"/></marker>
<marker id="ay" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f4d03f"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8804a"/></marker>
<marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fb5c9"/></marker>
<marker id="ap0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5aa9e6"/></marker>
<marker id="ap1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5cc97a"/></marker>
<marker id="ap2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2c044"/></marker>
<marker id="ap3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ef6b6b"/></marker>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#181b20"/><line x1="0" y1="0" x2="0" y2="8" stroke="#4a5059" stroke-width="3"/></pattern>
</defs>
<g transform="translate(0,0)">
<rect width="720" height="340" rx="10" fill="#121417"/>
<rect x="24" y="130" width="100" height="60" rx="4" fill="#1c1f24" stroke="#8b949e" stroke-width="1.5"/>
<text x="74" y="165" class="c b">CPU</text>
<rect x="205" y="36" width="90" height="44" rx="4" fill="#1c1f24" stroke="#f4d03f" stroke-width="1.5"/>
<text x="250" y="54" class="c s d">límite</text>
<text x="250" y="73" class="c m b">500</text>
<rect x="325" y="36" width="90" height="44" rx="4" fill="#1c1f24" stroke="#f4d03f" stroke-width="1.5"/>
<text x="370" y="54" class="c s d">base</text>
<text x="370" y="73" class="c m b">1000</text>
<line x1="250" y1="80" x2="250" y2="115" stroke="#cfd4da" stroke-width="2" marker-end="url(#aw)"/>
<line x1="124" y1="160" x2="197" y2="160" stroke="#cfd4da" stroke-width="2" marker-end="url(#aw)"/>
<line x1="370" y1="80" x2="370" y2="135" stroke="#cfd4da" stroke-width="2" marker-end="url(#aw)"/>
<polygon points="250,118 300,160 250,202 200,160" fill="#1c1f24" stroke="#cfd4da" stroke-width="1.5"/>
<text x="250" y="164" class="c s">&lt; límite?</text>
<line x1="300" y1="160" x2="345" y2="160" stroke="#cfd4da" stroke-width="2" marker-end="url(#aw)"/>
<text x="320" y="150" class="c s ok">sí</text>
<circle cx="370" cy="160" r="22" fill="#1c1f24" stroke="#cfd4da" stroke-width="1.5"/>
<text x="370" y="167" class="c b l">+</text>
<line x1="392" y1="160" x2="496" y2="138" stroke="#cfd4da" stroke-width="2" marker-end="url(#aw)"/>
<text x="445" y="184" class="c s d">dirección física</text>
<line x1="250" y1="202" x2="250" y2="244" stroke="#cfd4da" stroke-width="2" marker-end="url(#aw)"/>
<text x="262" y="228" class="s er">no</text>
<text x="250" y="266" class="c er b">excepción</text>
<text x="250" y="294" class="c s d">(el SO toma el control)</text>
<text x="160" y="118" class="c s d">dirección lógica</text>
<rect x="500" y="30" width="180" height="60" rx="0" fill="#3d3718" stroke="#c9a227" stroke-width="1.5"/>
<text x="590" y="65" class="c y b">SO</text>
<rect x="500" y="90" width="180" height="120" rx="0" fill="#5c2f1b" stroke="#e8804a" stroke-width="1.5"/>
<text x="590" y="190" class="c o b">P1</text>
<rect x="500" y="210" width="180" height="80" rx="0" fill="#181b20" stroke="#3a4048" stroke-width="1.5"/>
<text x="590" y="255" class="c d s">otros procesos</text>
<text x="492" y="34" class="m s d e">0</text>
<text x="492" y="94" class="m s d e">1000</text>
<text x="492" y="214" class="m s d e">1500</text>
<line x1="20" y1="300" x2="700" y2="300" stroke="#2a2e35"/>
<text x="160" y="148" class="c m b y l">200</text>
<circle cx="370" cy="160" r="22" fill="none" stroke="#4cc26a" stroke-width="3"/>
<line x1="392" y1="160" x2="496" y2="138" stroke="#4cc26a" stroke-width="3" marker-end="url(#ag)"/>
<text x="440" y="132" class="c m b ok">1200</text>
<rect x="500" y="136" width="180" height="4" rx="0" fill="#4cc26a" stroke="#4cc26a" stroke-width="1.5"/>
<text x="24" y="324" class="cap"><tspan class="d">1</tspan><tspan dx="10">Se suma la base: 200 + 1000 = 1200 es la dirección física</tspan></text>
</g>
<g transform="translate(0,352)">
<rect width="720" height="340" rx="10" fill="#121417"/>
<rect x="24" y="130" width="100" height="60" rx="4" fill="#1c1f24" stroke="#8b949e" stroke-width="1.5"/>
<text x="74" y="165" class="c b">CPU</text>
