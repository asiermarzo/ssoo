<line x1="392" y1="160" x2="496" y2="138" stroke="#cfd4da" stroke-width="2" marker-end="url(#aw)"/>
<text x="445" y="184" class="c s d">dirección física</text>
<line x1="250" y1="202" x2="250" y2="244" stroke="#cfd4da" stroke-width="2" marker-end="url(#aw)"/>
<text x="262" y="228" class="s er">no</text>
<text x="250" y="266" class="c er b">excepción</text>
