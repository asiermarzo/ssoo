<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 384" role="img" aria-label="Animación de la TLB: la página 2 está en la TLB y se traduce al momento; la página 3 no está, se lee de la tabla de páginas y su entrada se guarda en la TLB">
<style>
text{font-family:"Segoe UI",Helvetica,Arial,sans-serif;font-size:14px;fill:#e6e6e6}
.m{font-family:Consolas,"DejaVu Sans Mono",Menlo,monospace}
.d{fill:#8b949e}.ok{fill:#4cc26a}.er{fill:#ef5350}.y{fill:#f4d03f}.o{fill:#f0a070}.t{fill:#6fd3e3}
.c{text-anchor:middle}.e{text-anchor:end}.b{font-weight:600}.s{font-size:12px}.l{font-size:18px}.xl{font-size:26px}
.cap{font-size:14px}
.f{opacity:0}.fin{opacity:1}
.f0{animation:s3 15s linear 0s infinite}
.f1{animation:s3 15s linear -12s infinite}
.f2{animation:s3 15s linear -9s infinite}
.f3{animation:s3 15s linear -6s infinite}
.f4{animation:s3l 15s linear -3s infinite}
@keyframes s3{0%{opacity:0}2.33%{opacity:1}20.00%{opacity:1}22.33%{opacity:0}100%{opacity:0}}
@keyframes s3l{0%{opacity:0}2.33%{opacity:1}17.67%{opacity:1}20.00%{opacity:0}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.f{animation:none}}
</style>
<defs>
<marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cfd4da"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4cc26a"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ef5350"/></marker>
<marker id="ay" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f4d03f"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8804a"/></marker>
<marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fb5c9"/></marker>
<marker id="ap0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5aa9e6"/></marker>
<marker id="ap1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5cc97a"/></marker>
<marker id="ap2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2c044"/></marker>
<marker id="ap3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ef6b6b"/></marker>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#181b20"/><line x1="0" y1="0" x2="0" y2="8" stroke="#4a5059" stroke-width="3"/></pattern>
</defs>
<rect width="720" height="384" rx="10" fill="#121417"/>
<rect x="30" y="150" width="130" height="56" rx="4" fill="#1c1f24" stroke="#cfd4da" stroke-width="1.5"/>
<text x="95" y="175" class="c b">MMU</text>
<text x="320" y="30" class="c s d">TLB (caché dentro de la MMU)</text>
<rect x="240" y="38" width="160" height="106" rx="4" fill="#1c1f24" stroke="#3a4048" stroke-width="1.5"/>
<text x="320" y="204" class="c s d">Tabla de páginas (en memoria)</text>
<text x="600" y="150" class="c s d">marco</text>
<rect x="540" y="158" width="120" height="44" rx="4" fill="#1c1f24" stroke="#3a4048" stroke-width="1.5"/>
<line x1="20" y1="344" x2="700" y2="344" stroke="#2a2e35"/>
<rect x="250" y="212" width="140" height="28" rx="4" fill="#121417" stroke="#3a4048" stroke-width="1.5"/>
<text x="285" y="231" class="c m s d">pág 0</text>
<text x="355" y="231" class="c m s">→ 5</text>
<rect x="250" y="244" width="140" height="28" rx="4" fill="#121417" stroke="#3a4048" stroke-width="1.5"/>
<text x="285" y="263" class="c m s d">pág 1</text>
<text x="355" y="263" class="c m s">→ 1</text>
<rect x="250" y="276" width="140" height="28" rx="4" fill="#121417" stroke="#3a4048" stroke-width="1.5"/>
<text x="285" y="295" class="c m s d">pág 2</text>
<text x="355" y="295" class="c m s">→ 7</text>
<rect x="250" y="308" width="140" height="28" rx="4" fill="#121417" stroke="#3a4048" stroke-width="1.5"/>
<text x="285" y="327" class="c m s d">pág 3</text>
<text x="355" y="327" class="c m s">→ 3</text>
<g class="f f0">
<rect x="250" y="46" width="140" height="28" rx="4" fill="#121417" stroke="#3a4048" stroke-width="1.5"/>
<text x="285" y="65" class="c m s d">pág 5</text>
<text x="355" y="65" class="c m s">→ 2</text>
<rect x="250" y="78" width="140" height="28" rx="4" fill="#121417" stroke="#3a4048" stroke-width="1.5"/>
<text x="285" y="97" class="c m s d">pág 2</text>
<text x="355" y="97" class="c m s">→ 7</text>
<rect x="250" y="110" width="140" height="28" rx="4" fill="#121417" stroke="#3a4048" stroke-width="1.5"/>
<text x="285" y="129" class="c m s d">pág 9</text>
<text x="355" y="129" class="c m s">→ 4</text>
<text x="95" y="195" class="c m s y">pág 2</text>
<text x="24" y="368" class="cap"><tspan class="d">1/5</tspan><tspan dx="10">La MMU tiene que traducir una dirección de la página 2</tspan></text>
</g>
<g class="f f1">
<rect x="250" y="46" width="140" height="28" rx="4" fill="#121417" stroke="#3a4048" stroke-width="1.5"/>
<text x="285" y="65" class="c m s d">pág 5</text>
<text x="355" y="65" class="c m s">→ 2</text>
<rect x="250" y="78" width="140" height="28" rx="4" fill="#121417" stroke="#3a4048" stroke-width="1.5"/>
<text x="285" y="97" class="c m s d">pág 2</text>
<text x="355" y="97" class="c m s">→ 7</text>
<rect x="250" y="110" width="140" height="28" rx="4" fill="#121417" stroke="#3a4048" stroke-width="1.5"/>
<text x="285" y="129" class="c m s d">pág 9</text>
<text x="355" y="129" class="c m s">→ 4</text>
<rect x="250" y="78" width="140" height="28" rx="4" fill="none" stroke="#4cc26a" stroke-width="2.5"/>
<text x="95" y="195" class="c m s y">pág 2</text>
<line x1="160" y1="166" x2="247" y2="92" stroke="#4cc26a" stroke-width="2.5" marker-end="url(#ag)"/>
<line x1="392" y1="92" x2="537" y2="172" stroke="#4cc26a" stroke-width="2.5" marker-end="url(#ag)"/>
<text x="600" y="187" class="c m l b ok">7</text>
<text x="600" y="226" class="c s ok">acierto: rápido</text>
<text x="24" y="368" class="cap"><tspan class="d">2/5</tspan><tspan dx="10">La página 2 está en la TLB (acierto): marco 7 sin leer la tabla de páginas</tspan></text>
</g>
<g class="f f2">
<rect x="250" y="46" width="140" height="28" rx="4" fill="#121417" stroke="#3a4048" stroke-width="1.5"/>
<text x="285" y="65" class="c m s d">pág 5</text>
<text x="355" y="65" class="c m s">→ 2</text>
<rect x="250" y="78" width="140" height="28" rx="4" fill="#121417" stroke="#3a4048" stroke-width="1.5"/>
<text x="285" y="97" class="c m s d">pág 2</text>
<text x="355" y="97" class="c m s">→ 7</text>
<rect x="250" y="110" width="140" height="28" rx="4" fill="#121417" stroke="#3a4048" stroke-width="1.5"/>
<text x="285" y="129" class="c m s d">pág 9</text>
<text x="355" y="129" class="c m s">→ 4</text>
<text x="95" y="195" class="c m s y">pág 3</text>
<text x="24" y="368" class="cap"><tspan class="d">3/5</tspan><tspan dx="10">Ahora una dirección de la página 3</tspan></text>
</g>
<g class="f f3">
<rect x="250" y="46" width="140" height="28" rx="4" fill="#121417" stroke="#3a4048" stroke-width="1.5"/>
<text x="285" y="65" class="c m s d">pág 5</text>
<text x="355" y="65" class="c m s">→ 2</text>
<rect x="250" y="78" width="140" height="28" rx="4" fill="#121417" stroke="#3a4048" stroke-width="1.5"/>
<text x="285" y="97" class="c m s d">pág 2</text>
<text x="355" y="97" class="c m s">→ 7</text>
<rect x="250" y="110" width="140" height="28" rx="4" fill="#121417" stroke="#3a4048" stroke-width="1.5"/>
<text x="285" y="129" class="c m s d">pág 9</text>
<text x="355" y="129" class="c m s">→ 4</text>
<text x="95" y="195" class="c m s y">pág 3</text>
<line x1="160" y1="160" x2="236" y2="110" stroke="#ef5350" stroke-width="2.5" marker-end="url(#ar)"/>
<text x="196" y="112" class="c er l b">✕</text>
<rect x="250" y="308" width="140" height="28" rx="4" fill="none" stroke="#f4d03f" stroke-width="2.5"/>
<line x1="160" y1="196" x2="247" y2="322" stroke="#f4d03f" stroke-width="2.5" marker-end="url(#ay)"/>
<line x1="392" y1="322" x2="537" y2="190" stroke="#f4d03f" stroke-width="2.5" marker-end="url(#ay)"/>
<text x="600" y="187" class="c m l b y">3</text>
<text x="600" y="226" class="c s y">fallo de TLB:</text>
<text x="600" y="244" class="c s y">un acceso más a memoria</text>
<text x="24" y="368" class="cap"><tspan class="d">4/5</tspan><tspan dx="10">La página 3 no está en la TLB (fallo): se lee la tabla de páginas en memoria</tspan></text>
</g>
<g class="f f4 fin">
<rect x="250" y="46" width="140" height="28" rx="4" fill="#121417" stroke="#3a4048" stroke-width="1.5"/>
<text x="285" y="65" class="c m s d">pág 5</text>
<text x="355" y="65" class="c m s">→ 2</text>
<rect x="250" y="78" width="140" height="28" rx="4" fill="#121417" stroke="#3a4048" stroke-width="1.5"/>
<text x="285" y="97" class="c m s d">pág 2</text>
<text x="355" y="97" class="c m s">→ 7</text>
<rect x="250" y="110" width="140" height="28" rx="4" fill="#121417" stroke="#3a4048" stroke-width="1.5"/>
<text x="285" y="129" class="c m s d">pág 3</text>
<text x="355" y="129" class="c m s">→ 3</text>
<rect x="250" y="110" width="140" height="28" rx="4" fill="none" stroke="#4cc26a" stroke-width="2.5"/>
<text x="95" y="195" class="c m s y">pág 3</text>
<path d="M392,322 C460,322 460,124 394,124" fill="none" stroke="#4cc26a" stroke-width="2.5" marker-end="url(#ag)"/>
<text x="600" y="187" class="c m l b ok">3</text>
<text x="600" y="226" class="c s ok">la próxima vez</text>
<text x="600" y="244" class="c s ok">será un acierto</text>
<text x="24" y="368" class="cap"><tspan class="d">5/5</tspan><tspan dx="10">La entrada se copia a la TLB, sustituyendo a otra</tspan></text>
</g>
</svg>
