<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 412" role="img" aria-label="Animación de un fallo de página: el acceso a la página 3 encuentra V=0, la MMU lanza una excepción, el SO lee la página del disco al marco libre 7, pone V=1 y reejecuta la instrucción">
<style>
text{font-family:"Segoe UI",Helvetica,Arial,sans-serif;font-size:14px;fill:#e6e6e6}
.m{font-family:Consolas,"DejaVu Sans Mono",Menlo,monospace}
