.cap{font-size:14px}
.f{opacity:0}.fin{opacity:1}
.f0{animation:s3 18s linear 0s infinite}
.f1{animation:s3 18s linear -15s infinite}
.f2{animation:s3 18s linear -12s infinite}
.f3{animation:s3 18s linear -9s infinite}
.f4{animation:s3 18s linear -6s infinite}
.f5{animation:s3l 18s linear -3s infinite}
@keyframes s3{0%{opacity:0}1.94%{opacity:1}16.67%{opacity:1}18.61%{opacity:0}100%{opacity:0}}
@keyframes s3l{0%{opacity:0}1.94%{opacity:1}14.72%{opacity:1}16.67%{opacity:0}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.f{animation:none}}
</style>
